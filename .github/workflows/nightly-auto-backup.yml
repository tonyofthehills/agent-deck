name: Nightly Auto-Backup

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write  # Required to commit and push

jobs:
  auto-backup:
    name: Auto-Commit & Push Nightly Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: check_changes
        run: |
          # Check if there are any changes (staged, unstaged, or untracked)
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected - will create backup"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected - backup not needed"
          fi

      - name: Commit all changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Add all files (including untracked)
          git add -A

          # Count files changed
          CHANGED_FILES=$(git diff --cached --numstat | wc -l | xargs)

          # Create commit message
          DATE=$(date +"%Y-%m-%d %H:%M UTC")
          COMMIT_MSG="checkpoint: nightly auto-backup ($DATE) - $CHANGED_FILES files modified"

          # Commit
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Check current branch
          BRANCH=$(git branch --show-current)
          git push origin "$BRANCH"
          echo "✅ Backup pushed to GitHub (branch: $BRANCH)"

      - name: Generate Summary
        if: always()
        run: |
          BRANCH=$(git branch --show-current)
          echo "# Nightly Auto-Backup Report - Agent Deck" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]]; then
            echo "✅ **Status:** Backup created and pushed" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Changes:** $(git log -1 --pretty=%B)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️  **Status:** No changes to back up" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** app-009-agent-deck (Stream Deck for AI Agents)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic nightly backup for disaster recovery" >> $GITHUB_STEP_SUMMARY
